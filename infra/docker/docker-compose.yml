version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: odie-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odie_secret}
      POSTGRES_DB: ${POSTGRES_DB:-odie_polymarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odie} -d ${POSTGRES_DB:-odie_polymarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for BullMQ and locks
  redis:
    image: redis:7-alpine
    container_name: odie-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: odie-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-odie}:${POSTGRES_PASSWORD:-odie_secret}@postgres:5432/${POSTGRES_DB:-odie_polymarket}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY}
      API_PORT: 3001
      API_HOST: 0.0.0.0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Worker (BullMQ scheduler/executor)
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: odie-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-odie}:${POSTGRES_PASSWORD:-odie_secret}@postgres:5432/${POSTGRES_DB:-odie_polymarket}
      REDIS_URL: redis://redis:6379
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (React static build served by Caddy)
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    container_name: odie-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Caddy for TLS termination and reverse proxy (production)
  caddy:
    image: caddy:2-alpine
    container_name: odie-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
